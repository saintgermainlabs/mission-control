services:
  tailscale:
    image: 'ghcr.io/saintgermainlabs/tailscale-app-sidecar:latest'
    hostname: docmost
    environment:
      - 'TS_AUTHKEY=${TS_AUTHKEY}'
      - TS_HOSTNAME=docmost
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - 'TS_EXTRA_ARGS=--advertise-tags=tag:container --accept-dns=true'
      - APP_PORT=3000
    volumes:
      - 'tailscale-state:/var/lib/tailscale'
      - '/dev/net/tun:/dev/net/tun'
    cap_add:
      - NET_ADMIN
      - NET_RAW
    labels:
      - app.name=mission-control
      - app.component=tailscale-sidecar
    restart: unless-stopped

  mission-control:
    build:
      context: .
      dockerfile: Dockerfile

    network_mode: service:tailscale

    depends_on:
      - tailscale

    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/mission-control.db
      WORKSPACE_BASE_PATH: /app/workspace
      PROJECTS_PATH: /app/workspace/projects

      OPENCLAW_GATEWAY_URL: wss://openclaw.tiger-bushmaster.ts.net

    volumes:
      - mission-control-data:/app/data
      - mission-control-workspace:/app/workspace

    # Coolify manages lifecycle; avoid fighting its restart policy
    restart: "no"

volumes:
  mission-control-data:
  mission-control-workspace:
  tailscale-state:
