services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: mission-control

    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: true
      TS_EXTRA_ARGS: --advertise-tags=tag:container --accept-dns=true
      TS_SERVE_CONFIG: /config/serve.json

    volumes:
      - tailscale-state:/var/lib/tailscale
      # Mount the directory (not the file). Binding a missing file makes Docker
      # create an empty directory named serve.json, which crashes Tailscale Serve.
      - ./tailscale:/config:ro
      - /dev/net/tun:/dev/net/tun

    cap_add:
      - NET_ADMIN
      - NET_RAW

    restart: unless-stopped

  mission-control:
    build:
      context: .
      dockerfile: Dockerfile

    network_mode: service:tailscale

    depends_on:
      - tailscale

    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/mission-control.db
      WORKSPACE_BASE_PATH: /app/workspace
      PROJECTS_PATH: /app/workspace/projects

      OPENCLAW_GATEWAY_URL: wss://openclaw.tiger-bushmaster.ts.net

    volumes:
      - mission-control-data:/app/data
      - mission-control-workspace:/app/workspace

    # Coolify manages lifecycle; avoid fighting its restart policy
    restart: "no"
configs:
  mission-control-tailscale-serve:
    content: |
      {
        "TCP": {
          "443": {
            "HTTPS": true
          }
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": {
                "Proxy": "http://127.0.0.1:4000"
              }
            }
          }
        }
      }
volumes:
  mission-control-data:
  mission-control-workspace:
  tailscale-state:
